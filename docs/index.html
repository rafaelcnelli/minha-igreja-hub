    <script>
      (function() {
        try {
          if (window.location.hostname === 'rafaelcnelli.github.io' && !window.location.pathname.startsWith('/minha-igreja-hub')) {
            var target = '/minha-igreja-hub/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}

        try {
          var savedTheme = localStorage.getItem('theme') || localStorage.getItem('hub_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
