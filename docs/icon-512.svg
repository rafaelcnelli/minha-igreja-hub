<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="94" fill="none" stroke="#ea580c" stroke-opacity="0.35" stroke-width="4"/>
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>
  
  <!-- Church Cross -->
  <rect x="238" y="90" width="36" height="230" rx="18" fill="url(#accentGrad)"/>
  <rect x="166" y="160" width="180" height="36" rx="18" fill="url(#accentGrad)"/>
  
  <!-- Hub Network & Arches -->
  <path d="M130 385 L256 305 L382 385" fill="none" stroke="#ff6b35" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hub Nodes -->
  <circle cx="130" cy="385" r="24" fill="#ffffff"/>
  <circle cx="130" cy="385" r="14" fill="#ea580c"/>
  
  <circle cx="256" cy="305" r="26" fill="#ffffff"/>
  <circle cx="256" cy="305" r="16" fill="#ea580c"/>
  
  <circle cx="382" cy="385" r="24" fill="#ffffff"/>
  <circle cx="382" cy="385" r="14" fill="#ea580c"/>
  
  <circle cx="256" cy="90" r="18" fill="#ffffff"/>
  
  <!-- Foundation bar -->
